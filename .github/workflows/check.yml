name: Check

# push/pull_request run the gate. workflow_dispatch and the weekly schedule also
# run the optional `cores` job, which downloads the official Xray, sing-box and
# mihomo releases, verifies their SHA-256 and runs the real-core integration
# tests (including `mihomo -t` on every generated Clash profile). A
# push of a v* tag additionally runs `release`, which builds the archives and
# publishes them as a GitHub release.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Build the embedded web UI
        run: npm --prefix web run build
      - name: Frontend time tests
        run: npm run test:time
      # The QR encoder is decoded again with jsQR, and the client policy
      # simulator's address math is checked; both transpile the TypeScript
      # sources in memory.
      - name: Frontend self-tests
        run: |
          node web/scripts/qr-selftest.mjs
          node web/scripts/client-policy-selftest.mjs
          node web/scripts/portal-selftest.mjs
          node web/scripts/node-metrics-selftest.mjs
          node web/scripts/latency-chart-selftest.mjs
          node web/scripts/node-editor-selftest.mjs
          node web/scripts/tunnel-editor-selftest.mjs
          node web/scripts/server-detail-selftest.mjs
          node web/scripts/ui-regression-selftest.mjs
          node web/scripts/canvas-library-selftest.mjs
      - run: go vet ./...
      # The Agent command-line and storage tests run against a real binary built
      # with a fixed version string. AGENT_CANDIDATE_BINARY, AGENT_RELEASE_BINARY
      # and PANEL_BINARY have no remaining consumer, so no other fixture is built.
      - name: Build the Agent fixture
        run: |
          mkdir -p bin
          go build -trimpath -ldflags '-X main.version=1.0.0-storage-test' -o bin/proxy-agent-storage-test ./cmd/agent
      - name: Tests
        # platform/server took 34 min under -race at 141 tests (2026-10-28); there are 152 now.
        # Job logs need a signed-in viewer, so failing tests, panics and races
        # are also raised as annotations (GitHub shows 10 per step), which the run
        # page shows to anyone.
        run: |
          set -o pipefail
          status=0
          go test -race -timeout 55m ./... 2>&1 | tee "$RUNNER_TEMP/go-test.log" || status=$?
          if [ "$status" -ne 0 ]; then
            grep -E -- '^(--- FAIL|FAIL|panic:|WARNING: DATA RACE)|_test\.go:[0-9]+:' "$RUNNER_TEMP/go-test.log" |
              head -n 10 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$status"
        env:
          AGENT_BINARY: ${{ github.workspace }}/bin/proxy-agent-storage-test
      - name: Build the panel
        run: go build -o bin/proxy-panel ./cmd/panel
      - name: Build the agent
        run: go build -o bin/proxy-agent ./cmd/agent
      # The deploy scripts are the only way an operator installs, upgrades or
      # removes a host, so a syntax error in one of them is caught here rather
      # than at the first install. The POSIX scripts are parsed by sh (dash on this
      # runner) one file at a time, because sh -n only reads its first operand,
      # and they also have to run under busybox ash on Alpine. update-test.sh
      # exercises the update and recovery paths under QUI_UPDATE_TEST_ROOT and only
      # needs the scripts, so its absence is not a failure while it lives in a
      # separate change. host-network-test.sh runs the enforced-source units of the
      # release against a fake helper below /run and skips itself where neither
      # systemd nor OpenRC with busybox inotifyd is available.
      # core-asset-test.sh extracts the architecture and libc helpers of
      # install.sh and node-install.sh and needs no privileges, so it runs without
      # sudo.
      - name: Deploy script checks
        run: |
          set -euo pipefail
          for script in scripts/build-singbox.sh scripts/build-release.sh deploy/linux/*.sh; do bash -n -- "$script"; done
          for script in deploy/linux/update-recovery.sh deploy/openrc/host-network-watch \
            deploy/openrc/tuning-watch deploy/openrc/proxycontrol-update-recovery; do
            sh -n -- "$script"
          done
          if [ -f deploy/linux/tests/update-test.sh ]; then
            bash -n -- deploy/linux/tests/update-test.sh
            sudo bash deploy/linux/tests/update-test.sh
          fi
          if [ -f deploy/linux/tests/host-network-test.sh ]; then
            bash -n -- deploy/linux/tests/host-network-test.sh
            sudo bash deploy/linux/tests/host-network-test.sh
          fi
          if [ -f deploy/linux/tests/core-asset-test.sh ]; then
            bash -n -- deploy/linux/tests/core-asset-test.sh
            bash deploy/linux/tests/core-asset-test.sh
          fi
          # tuning-helper-test.sh activates the packaged tuning units against a fake
          # helper below /run and never writes host sysctls; the other two are rootless.
          sudo bash deploy/linux/tests/tuning-helper-test.sh
          bash deploy/linux/tests/multi-core-test.sh
          bash deploy/linux/tests/release-version-test.sh


  # Optional real-core job. Both releases are stable upstream releases and every
  # archive is checked against its published SHA-256 before it is extracted.
  cores:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      XRAY_VERSION: '26.3.27'
      SINGBOX_VERSION: '1.14.3'
      MIHOMO_VERSION: '1.19.33'
      GEODATA_COMMIT: '02ae05ac06e8c9287916fbabfe61ef5c8591407f'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Build the embedded web UI
        run: npm --prefix web run build
      - name: Download and verify Xray
        run: |
          set -euo pipefail
          asset="Xray-linux-64.zip"
          base="https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}"
          mkdir -p cores
          curl --fail --silent --show-error --location --max-redirs 3 --proto '=https' --tlsv1.2 -o "cores/${asset}" "${base}/${asset}"
          curl --fail --silent --show-error --location --max-redirs 3 --proto '=https' --tlsv1.2 -o "cores/${asset}.dgst" "${base}/${asset}.dgst"
          expected=$(grep -i -E '(sha2[-_]?256|sha256)[[:space:]]*=' "cores/${asset}.dgst" | grep -o -E '[0-9a-fA-F]{64}' | head -n 1 | tr 'A-F' 'a-f')
          test -n "${expected}"
          printf '%s  %s\n' "${expected}" "cores/${asset}" | sha256sum --check --strict
          unzip -q -d cores/xray "cores/${asset}"
          test -x cores/xray/xray
          printf 'XRAY_BINARY=%s/cores/xray/xray\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Download and verify sing-box
        run: |
          set -euo pipefail
          asset="sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          base="https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}"
          mkdir -p cores
          curl --fail --silent --show-error --location --max-redirs 3 --proto '=https' --tlsv1.2 -o "cores/${asset}" "${base}/${asset}"
          curl --fail --silent --show-error --location --max-redirs 3 --proto '=https' --tlsv1.2 -o cores/singbox-release.json "https://api.github.com/repos/SagerNet/sing-box/releases/tags/v${SINGBOX_VERSION}"
          expected=$(ASSET="${asset}" node -e '
            const fs = require("fs");
            const release = JSON.parse(fs.readFileSync("cores/singbox-release.json", "utf8"));
            const asset = (release.assets || []).find((item) => item.name === process.env.ASSET);
            if (!asset || typeof asset.digest !== "string" || !asset.digest.startsWith("sha256:")) {
              console.error("release asset carries no sha256 digest");
              process.exit(1);
            }
            console.log(asset.digest.slice("sha256:".length).toLowerCase());
          ')
          test -n "${expected}"
          printf '%s  %s\n' "${expected}" "cores/${asset}" | sha256sum --check --strict
          mkdir -p cores/singbox
          tar -xzf "cores/${asset}" -C cores/singbox
          test -x "cores/singbox/sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box"
          printf 'SINGBOX_BINARY=%s/cores/singbox/sing-box-%s-linux-amd64/sing-box\n' "$GITHUB_WORKSPACE" "$SINGBOX_VERSION" >> "$GITHUB_ENV"
      # mihomo checks every generated Clash profile with `mihomo -t`. `-t` loads
      # GeoIP, GeoSite and the MMDB and downloads them on first use, so the home
      # directory is seeded with files from a pinned meta-rules-dat commit whose
      # SHA-256 values are fixed here (the rolling `latest` release replaces its
      # assets daily and cannot be pinned).
      - name: Download and verify mihomo and its geodata
        run: |
          set -euo pipefail
          asset="mihomo-linux-amd64-compatible-v${MIHOMO_VERSION}.gz"
          base="https://github.com/MetaCubeX/mihomo/releases/download/v${MIHOMO_VERSION}"
          mkdir -p cores/mihomo cores/mihomo-home
          curl --fail --silent --show-error --location --max-redirs 3 --proto '=https' --tlsv1.2 -o "cores/${asset}" "${base}/${asset}"
          curl --fail --silent --show-error --location --max-redirs 3 --proto '=https' --tlsv1.2 -o cores/mihomo-release.json "https://api.github.com/repos/MetaCubeX/mihomo/releases/tags/v${MIHOMO_VERSION}"
          expected=$(ASSET="${asset}" node -e '
            const fs = require("fs");
            const release = JSON.parse(fs.readFileSync("cores/mihomo-release.json", "utf8"));
            const asset = (release.assets || []).find((item) => item.name === process.env.ASSET);
            if (!asset || typeof asset.digest !== "string" || !asset.digest.startsWith("sha256:")) {
              console.error("release asset carries no sha256 digest");
              process.exit(1);
            }
            console.log(asset.digest.slice("sha256:".length).toLowerCase());
          ')
          test -n "${expected}"
          printf '%s  %s\n' "${expected}" "cores/${asset}" | sha256sum --check --strict
          gunzip -c "cores/${asset}" > cores/mihomo/mihomo
          chmod 0755 cores/mihomo/mihomo
          geo="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/${GEODATA_COMMIT}"
          curl --fail --silent --show-error --location --max-redirs 3 --proto '=https' --tlsv1.2 -o cores/mihomo-home/GeoIP.dat "${geo}/geoip.dat"
          curl --fail --silent --show-error --location --max-redirs 3 --proto '=https' --tlsv1.2 -o cores/mihomo-home/GeoSite.dat "${geo}/geosite.dat"
          curl --fail --silent --show-error --location --max-redirs 3 --proto '=https' --tlsv1.2 -o cores/mihomo-home/Country.mmdb "${geo}/country.mmdb"
          printf '%s  %s\n' \
            a6271d3c96361d96156e6d3f7cf1550ef21b00d2f951deb772f464db91e89ac5 cores/mihomo-home/GeoIP.dat \
            c57333596b44aa061e84c3c224e97a4475c759a5e3baab1fcda002e48b4dc313 cores/mihomo-home/GeoSite.dat \
            ccec4d6fa69de3a79960a460c377ac9a23c1a90e5f9052dae3488921e56201df cores/mihomo-home/Country.mmdb | sha256sum --check --strict
          cores/mihomo/mihomo -v
          printf 'MIHOMO_BINARY=%s/cores/mihomo/mihomo\nMIHOMO_HOME=%s/cores/mihomo-home\n' "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      # Every test step runs even when an earlier one failed, so one dispatch
      # reports all real-core failures instead of stopping at the first.
      # ci-real-core-test.sh fails a step whose real-core tests skipped for a
      # missing core, core data or local address, or whose -run matched nothing.
      - name: Phase 10 device gates (official Xray and sing-box)
        if: ${{ !cancelled() }}
        run: bash scripts/ci-real-core-test.sh -p 1 -count=1 -run 'TestRealDeviceGate' ./internal/agent/core/xray ./internal/agent/core/singbox
      - name: Real-core tests
        if: ${{ !cancelled() }}
        # Includes U6 forward golden native validation and TCP/UDP echo tests.
        run: bash scripts/ci-real-core-test.sh -p 1 -count=1 -timeout 60m ./...
      - name: Part I forward native config and TCP/UDP checks
        if: ${{ !cancelled() }}
        run: bash scripts/ci-real-core-test.sh -p 1 -count=1 -run 'TestForwardGolden|TestRealForward' ./internal/agent/core/xray ./internal/agent/core/singbox
      - name: Build qui sing-box twice and verify reproducibility
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          GOCACHE="$RUNNER_TEMP/singbox-cache-first" OUTPUT_DIRECTORY="$RUNNER_TEMP/singbox-first" bash scripts/build-singbox.sh
          GOCACHE="$RUNNER_TEMP/singbox-cache-second" OUTPUT_DIRECTORY="$RUNNER_TEMP/singbox-second" bash scripts/build-singbox.sh
          for file in "$RUNNER_TEMP"/singbox-first/*; do
            cmp "$file" "$RUNNER_TEMP/singbox-second/${file##*/}"
          done
          mkdir -p cores/qui-singbox
          tar -xzf "$RUNNER_TEMP/singbox-first/sing-box-1.14.4-qui.1-linux-amd64.tar.gz" -C cores/qui-singbox
          binary="$GITHUB_WORKSPACE/cores/qui-singbox/sing-box-1.14.4-qui.1-linux-amd64/sing-box"
          "$binary" version | tee "$RUNNER_TEMP/qui-singbox-version.txt"
          grep -q 'sing-box version 1.14.4' "$RUNNER_TEMP/qui-singbox-version.txt"
          grep -q with_v2ray_api "$RUNNER_TEMP/qui-singbox-version.txt"
          grep -q go1.26.10 "$RUNNER_TEMP/qui-singbox-version.txt"
          printf 'SINGBOX_BINARY=%s\n' "$binary" >> "$GITHUB_ENV"
      - name: Qui sing-box real-core tests (including Phase 9 stats, Xray parity and Phase 10 gates)
        if: ${{ !cancelled() }}
        run: bash scripts/ci-real-core-test.sh -p 1 -count=1 -timeout 60m ./...
      - name: Release dry-run (no publication)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          VERSION=1.2.0 SKIP_NPM_CI=1 OUTPUT_DIRECTORY="$RUNNER_TEMP/dry-release" bash scripts/build-release.sh
          cd "$RUNNER_TEMP/dry-release"
          sha256sum --check --strict SHA256SUMS
          # The amd64 archive runs here, so check the version both binaries report.
          bundle=proxy-control-1.2.0-linux-amd64
          tar -xzf "$bundle.tar.gz"
          test "$(cat "$bundle/VERSION")" = 1.2.0
          test "$("$bundle/bin/proxy-panel" -version)" = "proxy-panel 1.2.0"
          test "$("$bundle/bin/proxy-agent" -version)" = "proxy-agent 1.2.0"
          for arch in amd64 arm64; do
            test -s "sing-box-1.14.4-qui.1-linux-$arch.tar.gz"
            test -s "sing-box-1.14.4-qui.1-linux-$arch.provenance.txt"
            for suffix in tar.gz provenance.txt; do
              asset="sing-box-1.14.4-qui.1-linux-$arch.$suffix"
              test "$(awk -v asset="$asset" '$2 == asset {n++} END {print n+0}' SHA256SUMS)" = 1
            done
            cmp "sing-box-1.14.4-qui.1-linux-$arch.tar.gz" "$RUNNER_TEMP/singbox-first/sing-box-1.14.4-qui.1-linux-$arch.tar.gz"
          done


  # Publishing a release is a tag push. The job reuses the gate above and only
  # accepts vMAJOR.MINOR.PATCH tags; build-release.sh then produces one archive
  # per architecture plus SHA256SUMS, and both are attached to the release that
  # qui-update and the manual upgrade path download from. node-install.sh is
  # attached as well, because the register dialog pipes it straight from the
  # release URL into bash on a fresh node.
  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # vX.Y.Z-rc.N uses the grammar of qui-update/node-install.sh and is published
      # as a pre-release, so /releases/latest (plain qui-update) never selects it.
      - name: Reject a tag that is not vMAJOR.MINOR.PATCH[-rc.N]
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]] || {
            printf 'Tag %s is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N.\n' "$GITHUB_REF_NAME" >&2
            exit 1
          }
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the release archives
        run: VERSION="${GITHUB_REF_NAME#v}" OUTPUT_DIRECTORY="$RUNNER_TEMP/dist" scripts/build-release.sh
      - name: Publish the GitHub release
        run: |
          set -euo pipefail
          prerelease=()
          [[ $GITHUB_REF_NAME == *-rc.* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/dist/proxy-control-*.tar.gz "$RUNNER_TEMP"/dist/sing-box-*-qui.*-linux-*.tar.gz "$RUNNER_TEMP"/dist/sing-box-*-qui.*-linux-*.provenance.txt "$RUNNER_TEMP/dist/SHA256SUMS" deploy/linux/node-install.sh --title "$GITHUB_REF_NAME" --generate-notes "${prerelease[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
