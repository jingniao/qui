syntax = "proto3";
package proxycontrol.agent.v1;
option go_package = "proxycontrol/pkg/contracts/agentpb";
import "google/protobuf/timestamp.proto";

service AgentControl {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  rpc Connect(stream AgentMessage) returns (stream ServerMessage);
  rpc RenewCertificate(CertificateRequest) returns (CertificateRenewal);
  rpc ConfirmCATrust(CATrustConfirmation) returns (CATrustAcknowledgement);
  rpc PrepareNodeRootRetirement(NodeRootRetirementRequest) returns (NodeRootRetirementResponse);
  rpc ConfirmNodeRootRetirement(NodeRootRetirementConfirmation) returns (NodeRootRetirementAcknowledgement);
}
message NodeRootRetirementConfirmation { string plan_digest = 1; bytes proof_json = 2; }
message NodeRootRetirementAcknowledgement { string plan_digest = 1; string proof_digest = 2; string certificate_fingerprint = 3; google.protobuf.Timestamp confirmed_at = 4; }
message NodeRootRetirementRequest { string plan_digest = 1; string challenge = 2; bytes pinned_ca_pem = 3; }
message NodeRootRetirementResponse { bytes proof_json = 1; }
message CATrustConfirmation { bytes manifest_json = 1; string plan_digest = 2; bytes source_ca_pem = 3; bytes target_ca_pem = 4; bytes bridge_ca_pem = 5; }
message CATrustAcknowledgement { string plan_digest = 1; string target_fingerprint = 2; google.protobuf.Timestamp confirmed_at = 3; }

message CertificateRequest { bytes csr_pem = 1; bool immediate = 2; bool confirm_only = 3; bool rotate_key = 4; }
message CertificateRenewal { bytes certificate_pem = 1; bytes ca_pem = 2; google.protobuf.Timestamp expires_at = 3; bool explicit_renewal_supported = 4; bool confirmed = 5; bool key_rotation_supported = 6; }

message EnrollRequest {
  string enrollment_token = 1;
  bytes csr_pem = 2;
  string hostname = 3;
  string operating_system = 4;
  string agent_version = 5;
}
message EnrollResponse {
  string node_id = 1;
  bytes certificate_pem = 2;
  bytes ca_pem = 3;
  google.protobuf.Timestamp expires_at = 4;
}
message Hello { uint64 last_acked_sequence = 1; string agent_version = 2; bool budget_retirement_supported = 3; bool core_update_supported = 4; bool agent_update_supported = 5; bool agent_recovery_supported = 6; bool health_check_supported = 7; bool core_restart_supported = 8; }
message ProtocolCapability { string protocol = 1; bool inbound = 2; bool outbound = 3; bool tcp = 4; bool udp = 5; }
// Fields 4-15 are the former patched-core capabilities. V1 runs official
// upstream cores only (plan D1/D4/D5), so they are never set and always read as
// false/zero: the agent reports the core name, the upstream version and the
// protocol matrix, and derives the upstream API facts from the version.
message Capabilities { string core_name = 1; string core_version = 2; repeated ProtocolCapability protocols = 3; bool connection_admission_supported = 4; bool connection_ledger_supported = 5; bool connection_generation_supported = 6; bool connection_fence_supported = 7; bool connection_observation_supported = 8; int32 observation_contract_version = 9; bool domain_bytes_supported = 10; bool egress_envelope_supported = 11; int32 egress_envelope_version = 12; bool udp_per_target_observed = 13; int32 max_egress_hops = 14; string observation_edition = 15; }
message Heartbeat {
  optional double cpu_percent = 1;
  optional double memory_percent = 2;
  optional double disk_percent = 3;
  uint64 active_connections = 4;
  uint64 upload_bytes = 5;
  uint64 download_bytes = 6;
  int64 current_revision = 7;
  int64 successful_revision = 8;
  string public_ip = 9;
  optional bool core_healthy = 10;
  string core_error = 11;
  optional bool active_connections_measured = 12;
  string active_connections_scope = 13;
  google.protobuf.Timestamp active_connections_observed_at = 14;
  SpoolStatus spool_status = 15;
  CollectorStatus collector_status = 16;
  TrafficSourceStatus traffic_source_status = 17;
}
message TrafficSourceStatus {
  string status = 1;
  string core_epoch = 2;
  int64 revision = 3;
  uint64 configured_sources = 4;
  uint64 observed_sources = 5;
  bool core_running = 6;
  google.protobuf.Timestamp observed_at = 7;
  google.protobuf.Timestamp last_success_at = 8;
}
message CollectorStatus {
  string process_id = 1;
  string status = 2;
  uint64 pending_observations = 3;
  uint64 aggregated_rollups = 4;
  uint64 dropped_allowed_observations = 5;
  uint64 dropped_blocked_observations = 6;
  uint64 rejected_observations = 7;
  uint64 persistence_failures = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp observed_at = 10;
  google.protobuf.Timestamp last_flush_at = 11;
  google.protobuf.Timestamp last_flush_success_at = 12;
  bool counters_saturated = 13;
  CollectorLossStatus persisted_loss = 14;
}
message CollectorLossStatus {
  bool measured = 1;
  string status = 2;
  uint64 generation = 3;
  uint64 dropped_allowed_observations = 4;
  uint64 dropped_blocked_observations = 5;
  uint64 rejected_observations = 6;
  uint64 persistence_failures = 7;
  uint64 unconfirmed_processes = 8;
  google.protobuf.Timestamp baseline_at = 9;
  google.protobuf.Timestamp checkpoint_at = 10;
  bool counters_saturated = 11;
  bool coverage_incomplete = 12;
  bool end_confirmed = 13;
}
message SpoolStatus {
  bool measured = 1;
  uint64 payload_bytes = 2;
  uint64 disk_bytes = 3;
  uint64 disk_limit = 4;
  uint64 pending_batches = 5;
  uint64 dropped_allowed_rollups = 6;
  string status = 7;
  google.protobuf.Timestamp observed_at = 8;
  uint64 database_bytes = 9;
  uint64 database_limit = 10;
  string failure_code = 11;
  ReplayHeadStatus final_usage_head = 12;
  ReplayHeadStatus runtime_source_head = 13;
  ReplayHeadStatus access_ack = 14;
  ReplayHeadStatus traffic_ack = 15;
  ReplayHeadStatus final_usage_ack = 16;
  ReplayHeadStatus runtime_source_ack = 17;
  ReplayAckHistoryStatus access_ack_history = 18;
  ReplayAckHistoryStatus traffic_ack_history = 19;
  ReplayAckHistoryStatus final_usage_ack_history = 20;
  ReplayAckHistoryStatus runtime_source_ack_history = 21;
}
message ReplayAckHistoryStatus {
  bool measured = 1;
  string status = 2;
  uint64 attempt_sequence = 3;
  uint64 failure_count = 4;
  uint64 unconfirmed_count = 5;
  google.protobuf.Timestamp recorded_at = 6;
  google.protobuf.Timestamp observed_at = 7;
}
message ReplayHeadStatus {
  string status = 1;
  google.protobuf.Timestamp observed_at = 2;
}
message AgentMessage {
  string node_id = 1;
  string message_id = 2;
  uint64 sequence = 3;
  google.protobuf.Timestamp timestamp = 4;
  int64 revision = 5;
  oneof payload { Hello hello = 10; Heartbeat heartbeat = 11; Capabilities capabilities = 12; ApplyResult apply_result = 13; OutboundHealthBatch outbound_health = 14; AccessBatch access_batch = 15; TrafficBatch traffic_batch = 16; FinalUsageBatch final_usage_batch = 17; RuntimeSourceBatch runtime_source_batch = 18; BudgetRetirementResult budget_retirement_result = 19; CoreUpdateResult core_update_result = 20; AgentUpdateResult agent_update_result = 21; ConnectionStatus connection_status = 22; HealthCheckResult health_check_result = 23; ObservationBatch observation_batch = 24; EgressProofBatch egress_proof_batch = 25; }
}
message ObservationBatch { bytes batch_json = 1; }
message EgressProofBatch { bytes proof_json = 1; }
message ConnectionStatus { bytes snapshot_json = 1; }
message Welcome { uint64 last_accepted_sequence = 1; uint32 heartbeat_interval_seconds = 2; bool final_usage_supported = 3; bool runtime_source_supported = 4; bool budget_retirement_supported = 5; bool core_update_supported = 6; bool agent_update_supported = 7; bool agent_recovery_supported = 8; bool connection_observation_supported = 9; bool health_check_supported = 10; bool core_restart_supported = 11; string node_ca_migration_plan_digest = 12; string node_ca_reconfirmation_plan_digest = 13; bool connection_observation_bytes_supported = 14; bool egress_envelope_supported = 15; int32 observation_contract_version = 16; int32 egress_envelope_version = 17; int32 max_egress_hops = 18; }
message AgentUpdateCommand { bytes request_json = 1; }
message AgentUpdateResult { bytes result_json = 1; }
message CoreUpdateCommand { bytes request_json = 1; }
message CoreUpdateResult { bytes result_json = 1; }
message BudgetRetirementCommand { bytes request_json = 1; }
message BudgetRetirementResult { string request_id = 1; bool success = 2; string code = 3; bytes receipt_json = 4; }
message Ack { uint64 agent_sequence = 1; string access_batch_id = 2; string traffic_batch_id = 3; string final_usage_epoch = 4; string runtime_source_epoch = 5; string observation_core_epoch = 6; uint64 observation_to_sequence = 7; string egress_proof_id = 8; }
message RuntimeSourceBatch { bytes source_json = 1; }
message FinalUsageBatch { bytes usage_json = 1; }
message AccessBatch { bytes batch_json = 1; }
message TrafficBatch { bytes batch_json = 1; }
message ApplyCommand { bytes desired_state_json = 1; }
message ApplyResult { int64 revision = 1; bool success = 2; bool rolled_back = 3; string code = 4; string command_id = 5; bytes final_usage_json = 6; }
message OutboundHealth { string outbound_id = 1; bool healthy = 2; int64 latency_ms = 3; google.protobuf.Timestamp checked_at = 4; }
message OutboundHealthBatch { repeated OutboundHealth items = 1; }
message RollbackCommand { string command_id = 1; int64 revision = 2; bool restart_current = 3; }
message ServerMessage {
  string node_id = 1;
  string message_id = 2;
  uint64 sequence = 3;
  google.protobuf.Timestamp timestamp = 4;
  int64 revision = 5;
  oneof payload { Welcome welcome = 10; Ack ack = 11; ApplyCommand apply_command = 12; RollbackCommand rollback_command = 13; BudgetRetirementCommand budget_retirement_command = 14; CoreUpdateCommand core_update_command = 15; AgentUpdateCommand agent_update_command = 16; HealthCheckCommand health_check_command = 17; }
}




message HealthCheckCommand { string id = 1; int64 revision = 2; google.protobuf.Timestamp deadline = 3; }
message HealthCheckResult { string id = 1; int64 revision = 2; bool healthy = 3; string code = 4; google.protobuf.Timestamp observed_at = 5; }
